version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: electiq
    ports:
      - "5432:5432"
    volumes:
      - electiq_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/electiq?schema=public"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "replace-with-a-long-random-string"
      # Required as of Sprint 11 — evidence and MFA secrets cannot be
      # encrypted at rest without this. Generate with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      EVIDENCE_ENCRYPTION_KEY: "replace-with-a-real-32-byte-base64-key"
      # Optional (Sprint 7) — without it, the Copilot reports itself as
      # unconfigured rather than fabricating a response.
      ANTHROPIC_API_KEY: ""
      NODE_ENV: "production"
    ports:
      - "3000:3000"

volumes:
  electiq_db_data:
