name: CI

# Section 12 — CI/CD pipeline. Every stage here runs the same commands a
# contributor runs locally (npm run typecheck/test/build/audit/sbom) —
# nothing CI-specific to keep in sync, and nothing that "only works in CI."

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # postgis/postgis, not plain postgres — this schema requires the
      # PostGIS extension (see README's "About the Prisma setup") and a
      # migration would fail against a database that doesn't have it.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: electiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/electiq?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-secret-not-for-production-use-1234567890
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate a real 32-byte encryption key for this run
        run: echo "EVIDENCE_ENCRYPTION_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")" >> "$GITHUB_ENV"

      - name: Typecheck
        run: npm run typecheck

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Seed the database
        run: npm run seed

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency vulnerability scan (informational — does not fail the build)
        run: npm run audit || true

      - name: Generate SBOM
        run: npm run sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
